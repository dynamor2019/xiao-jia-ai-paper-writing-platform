# 科技论文研究 Agent Preset
# 只保留选题、研究、实验、写作、校验和投稿需要的工具

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a paper assistant in {{cwd}} using {{model}}. Send only the context this step needs.
      Load a skill only when the current step matches it. Do not invent data, citations, authors, funding, ethics, or results.
      For manuscript prose, load academic-humanizer during writing and polishing; style edits must preserve evidence and scientific review.
      One conversation is one project. Do not open a second pipeline while that project's work-chain is open.
      Draft manuscript prose one saved paragraph at a time. Use only the tools this step requires.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell (运行 pandoc/python 等) ──────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 后台任务控制（服务当前论文 Agent 的 shell/子任务作业）───────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 文件操作 ────────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills (paper-writer 等) ───────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - __DSH_PAPER_PROJECT_DIR__\.dsh\skills

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogDescriptionMaxLength: 120

# ── 待办 (论文写作进度) ────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

# ── 长期目标自动续轮 ────────────────────────────────────────────────────────
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 联网搜索 (查文献、最新资讯) ─────────────────────────────────────────────
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 询问用户 ────────────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── 上下文压缩 (长论文对话需要) ─────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.4
        retainRatio: 0.12
        headroomTokens: 16384
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 3000
        headChars: 1200
        tailChars: 400
