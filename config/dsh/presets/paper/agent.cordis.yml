# 科技论文研究 Agent Preset
# 只保留选题、研究、实验、写作、校验和投稿需要的工具

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a paper assistant using {{model}}. Follow the current working directory supplied in runtime context. Send only the context this step needs.
      Load a skill only when the current step matches it. Do not invent data, citations, authors, funding, ethics, or results.
      For manuscript prose, load academic-humanizer during writing and polishing; style edits must preserve evidence and scientific review.
      One conversation is one project. Do not open a second pipeline while that project's work-chain is open.
      Before resuming after a checkpoint or changing phase, read the bound project's existing pipeline state and relevant saved results; preserve user corrections and completed work. A summary is a navigation aid, not a substitute for evidence. Do not repeat completed experiments without a specific invalidation reason.
      If a tool result is marked pruned or a needed fact is absent from the summary, read the relevant range of its original file before deciding. Missing context is not evidence that work is missing. Report uncertainty when the original evidence cannot be located; do not create a new report just to restate progress.
      Draft manuscript prose one saved paragraph at a time. Use only the tools this step requires.
      Follow the six PaperPipeline phases: question, protocol/data-source route, formal results, literature/manuscript, cross-review, delivery.
      Classify evidence before planning: for newly run experiments use executionMode=run-experiments and a feasibility pilot; for author-provided datasets use executionMode=provided-data, list every project-relative sourceFiles path, skip pilot, and run only a declared reproducible analysis batch. Use config/dsh/examples/provided-data-experiment-plan.json for provided data.
      In either route, retain source provenance, freeze the analysis protocol before confirmatory analysis, preserve adverse/null outcomes, and pass the same data-integrity and reproducibility gates before writing.
      Each bounded batch must answer the same research question. Pilot acceptance tests feasibility and data integrity, not a favorable hypothesis outcome.
      Preserve the original hypothesis. Explain negative/null/conditional results; post-result hypotheses are exploratory unless independently tested.
      Use continue_paper_workflow for the bound project; do not launch a second writer or repeatedly resume healthy work.
      Optional review or prose failures may leave a marked draft; billing failures and unreliable data stop dependent work. Never report these as PASS.
      Retain original inputs, formal results, checkpoints and review history. Only expired disposable runtime/tmp files are automatically cleaned.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell (运行 pandoc/python 等) ──────────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 后台任务控制（服务当前论文 Agent 的 shell/子任务作业）───────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 文件操作 ────────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills (paper-writer 等) ───────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - __DSH_PAPER_PROJECT_DIR__\.dsh\skills

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogDescriptionMaxLength: 120

# ── 待办 (论文写作进度) ────────────────────────────────────────────────────
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

# ── 长期目标自动续轮 ────────────────────────────────────────────────────────
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 联网搜索 (查文献、最新资讯) ─────────────────────────────────────────────
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 询问用户 ────────────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── 上下文压缩 (长论文对话需要) ─────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.75
        retainRatio: 0.25
        headroomTokens: 16384
        maxTokens: 8192
        compactionRetries: 0
        maxOverflowRetries: 1
        modelPolicies:
          - provider: rayinai-claude
            model: claude-opus-5-5
            thresholdRatio: 0.25
            retainRatio: 0.08
          - provider: sub2api-grok
            model: grok-4.7
            thresholdRatio: 0.25
            retainRatio: 0.08
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
