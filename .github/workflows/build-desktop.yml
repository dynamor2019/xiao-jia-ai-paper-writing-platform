name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure mirrors
        shell: pwsh
        run: |
          "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com" >> $env:GITHUB_ENV
          "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Test paper workflows
        run: npm test

      - name: Test startup and model routing locks
        run: npm run test:startup

      - name: Test model calls and upgrade protection
        run: npm run test:models

      - name: Test project updates and rollback
        run: npm run test:updates

      - name: Package source without dependencies
        # CI dependencies are used for validation only, never uploaded.
        run: node scripts/package-platform-update.mjs

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao-jia-ai-project-source
          path: |
            release/XiaoJiaAI-Source-*.zip
            release/xiaojia-update.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/XiaoJiaAI-Source-*.zip
            release/xiaojia-update.json
          generate_release_notes: true
          body_path: docs/release-notes-0.1.9.md
