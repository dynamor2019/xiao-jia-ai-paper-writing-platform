name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows desktop exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure mirrors
        shell: pwsh
        run: |
          "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com" >> $env:GITHUB_ENV
          "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build TypeScript
        run: npm run build

      - name: Test paper workflows
        run: npm test

      - name: Package desktop app
        run: npm run desktop:pack:github

      - name: Zip desktop app
        shell: pwsh
        run: |
          $name = "XiaoJiaAI-Paper-Writing-Platform-${{ github.ref_name }}-Windows.zip"
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/$name" -Force

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiao-jia-ai-paper-writing-platform-windows
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
